<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maria-Lyn Sprite</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1b1b22, #090a10 60%);
        color: #f5f1ea;
        font-family: Arial, sans-serif;
      }
      .card {
        background: rgba(18, 19, 28, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 18px 45px rgba(0,0,0,0.45);
        text-align: center;
      }
      img {
        width: min(32vw, 215px);
        height: auto;
        image-rendering: pixelated;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.25));
      }
      h1 {
        margin-top: 16px;
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="lyn-maria-sprite.svg" alt="Side-profile pixel-art Lyn with white hair, a pointed hat, and a long dark-brown coat" />
      <h1>Maria-Lyn</h1>
    </div>
  </body>
</html>
